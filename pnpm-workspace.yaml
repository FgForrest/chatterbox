packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: true
  sharp: true

overrides:
  '@protobufjs/utf8': 1.1.1
  defu: 6.1.5
  drizzle-kit>@esbuild-kit/esm-loader: '-'
  js-yaml: 4.3.2
  mailauth>nodemailer: 10.1.4
  mailauth>undici: 8.12.2
  mailparser>nodemailer: 10.1.4
  postcss: 8.5.23
  rollup: 4.59.0
  smtp-server>nodemailer: 10.1.4
  vite: 7.3.7

minimumReleaseAge: 10080

trustPolicy: no-downgrade

minimumReleaseAgeExclude:
  - acorn@8.19.0
  - express-rate-limit@8.7.1
  - nanoid@3.3.20
  - nodemailer@10.0.15

trustPolicyExclude:
  - undici-types@6.21.0
