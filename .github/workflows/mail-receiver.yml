name: Mail receiver image

# The inbound SMTP server (mail-receiver/), published next to the app
# image as `ghcr.io/<owner>/<repository>-mail-receiver` with the same tags
# (see docker.yml): `:dev` from a push to `dev`, `:<version>` and `:latest`
# when release.yml calls this. Its own workflow, so a receiver change can be
# built alone. Pull requests that touch it build both platforms without
# pushing.
on:
  push:
    branches:
      - dev
  workflow_call:
    inputs:
      version:
        description: Release version (YYYY.N)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/mail-receiver.yml
      - mail-receiver/**
      - src/lib/mail/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json

concurrency:
  group: mail-receiver-${{ github.ref }}-${{ inputs.version || 'dev' }}
  cancel-in-progress: ${{ !inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE" ]; then
            echo "app=$RELEASE" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=dev" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-mail-receiver
          tags: |
            type=raw,value=${{ steps.version.outputs.app }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=dev,enable=${{ steps.version.outputs.release != 'true' }}

      - name: Compute arch-suffixed tags
        id: arch_tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo 'tags<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "${tag}-${ARCH}"
            done <<< "$TAGS"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mail-receiver/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mail-receiver-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mail-receiver-${{ matrix.arch }}

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve version
        id: version
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE" ]; then
            echo "app=$RELEASE" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=dev" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-mail-receiver
          tags: |
            type=raw,value=${{ steps.version.outputs.app }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=dev,enable=${{ steps.version.outputs.release != 'true' }}

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          source_tag="$(head -n1 <<< "$TAGS")"

          dest_flags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && dest_flags+=(-t "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${dest_flags[@]}" \
            "${source_tag}-amd64" \
            "${source_tag}-arm64"

      - name: Inspect image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker buildx imagetools inspect "$(head -n1 <<< "$TAGS")"
