<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Chatterbox Meeting Recorder</title>
        <link rel="stylesheet" href="../popup/popup.css">
        <link rel="stylesheet" href="../picker/picker.css">
        <link rel="stylesheet" href="request.css">
    </head>
    <body>
        <header class="picker-header">
            <img src="../icons/icon-128.png" alt="" width="58" height="58">
            <div>
                <h1 data-i18n="extensionName"></h1>
                <p id="meeting-title"></p>
            </div>
        </header>
        <p data-i18n="micRequestIntro"></p>
        <p id="mic-status" role="status"></p>
        <p id="notice-text" class="hint"></p>
        <p class="hint" data-i18n="meetingPickerHint"></p>
        <div class="actions">
            <button
                id="grant-mic"
                class="primary"
                type="button"
                data-i18n="grantMic"
            ></button>
            <button
                id="start"
                class="primary"
                type="button"
                hidden
                data-i18n="recordWithConsent"
            ></button>
            <button
                id="without-mic"
                type="button"
                data-i18n="recordWithoutMic"
            ></button>
            <button id="cancel" type="button" data-i18n="cancel"></button>
        </div>
        <script type="module" src="request.js"></script>
    </body>
</html>
