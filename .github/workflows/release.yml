name: Release

# Every push to `main` is a release. The version is `YYYY.N`: the year of
# the run, then N counting up from 1 within that year (2026.1, 2026.2, ...).
# The images are built first; the tag and the GitHub release are created
# only when both builds pass, so a failed run releases nothing and a re-run
# takes the same number. A tag pushed with GITHUB_TOKEN starts no other
# workflow, which is why the builds run in here instead of on the tag.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      released: ${{ steps.next.outputs.released }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the next version
        id: next
        run: |
          set -euo pipefail
          existing="$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]+$' | head -n1 || true)"
          if [ -n "$existing" ]; then
            echo "This commit is already released as $existing"
            echo "version=$existing" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          year="$(date -u +%Y)"
          last="$(git tag --list "${year}.*" | sed -nE "s/^${year}\.([0-9]+)$/\1/p" | sort -n | tail -n1)"
          version="${year}.$(( ${last:-0} + 1 ))"
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released=false" >> "$GITHUB_OUTPUT"

  app:
    needs: version
    if: needs.version.outputs.released != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  mail-receiver:
    needs: version
    if: needs.version.outputs.released != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mail-receiver.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, app, mail-receiver]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # softprops/action-gh-release renames hidden files (e.g. `.env.example`)
      # by prefixing them with `default.` on upload, which breaks predictable
      # download URLs. Copy to a non-hidden name so the asset is uploaded as
      # `env.example` and stays curl-friendly.
      - name: Prepare install artifacts
        run: cp .env.example env.example

      # Creates the tag on this commit and the release, with notes generated
      # from the pull requests merged since the previous release.
      - name: Create the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            docker-compose.yml
            env.example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
