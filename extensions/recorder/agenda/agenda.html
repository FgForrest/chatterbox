<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Agenda</title>
        <link rel="stylesheet" href="../generated/folders.css" />
        <link rel="stylesheet" href="../popup/popup.css" />
        <link rel="stylesheet" href="agenda.css" />
    </head>
    <body>
        <header class="agenda-header">
            <div><h1 id="title" data-i18n="agendaMeetingTitle"></h1><p id="time" class="hint"></p></div>
            <button id="change-agenda" class="link" type="button" data-i18n="agendaChange"></button>
            <button id="back" class="link" type="button" data-i18n="agendaBack" hidden></button>
        </header>
        <section id="colleague-recording" class="presence" hidden><p id="recording-by"></p><button id="record-also" class="link" type="button" data-i18n="recordAlso"></button></section>
        <section id="recorder-controls" class="recorder-controls"></section>
        <p id="recording-state" class="hint" role="status"></p>
        <section id="agenda-error" class="agenda-error" hidden role="alert">
            <p id="status" class="error"></p>
            <p class="hint" data-i18n="agendaLoadErrorHint"></p>
            <button id="agenda-retry" type="button" data-i18n="agendaReload"></button>
        </section>
        <main id="agenda" hidden>
            <section aria-labelledby="points-heading">
                <div class="section-heading"><h2 id="points-heading" data-i18n="agendaPoints"></h2><span id="point-count" class="hint"></span></div>
                <div id="point-progress" class="agenda-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div>
                <div id="points"></div>
            </section>
            <section aria-labelledby="tasks-heading">
                <div class="section-heading"><h2 id="tasks-heading" data-i18n="agendaTasks"></h2><span id="task-count" class="hint"></span></div>
                <div id="tasks"></div>
            </section>
            <p id="away-hint" class="hint" data-i18n="agendaReadOnlyHint"></p>
        </main>
        <section id="choices" hidden aria-labelledby="title">
            <p class="hint" data-i18n="agendaChoicesHint"></p>
            <div id="choice-list"></div>
            <button id="none" class="agenda-option" type="button" data-i18n="agendaNone"></button>
            <p class="hint" data-i18n="agendaNoneHint"></p>
        </section>
        <script type="module" src="agenda.js"></script>
    </body>
</html>
