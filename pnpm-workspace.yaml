packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true

overrides:
  '@protobufjs/utf8': 1.1.1
  defu: 6.1.5
  js-yaml: 4.3.2
  postcss: 8.5.23
  rollup: 4.59.0
  vite: 7.3.5

minimumReleaseAge: 10080

trustPolicy: no-downgrade

minimumReleaseAgeExclude:
  - acorn@8.19.0
  - express-rate-limit@8.7.1
  - nanoid@3.3.20
  - nodemailer@10.0.15

trustPolicyExclude:
  - protobufjs@6.11.6
  - undici-types@6.21.0
