# Single sign-on for the e2e stack: a Keycloak with a test realm, and the app
# configured to sign in only through it.
#
#   docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.sso.yml up -d --build
#
# Realm `riffado-e2e`, client `riffado`. Users (password = <name>-password):
#   alice  verified email, new to Riffado
#   bob    unverified email, new to Riffado
#   carol  verified email; register carol@example.com with a password first
#          (without this override) to see the account linked
#   dave   unverified email; same, to see linking refused
# MCP clients: `riffado-mcp` (resource, holds the roles), `riffado-mcp-tester`
# (public, password grant, test only), `riffado-mcp-bot` (service account,
# secret riffado-mcp-bot-secret), `claude` (hosted Claude apps, secret
# claude-e2e-client-secret) and `claude-code` (public, loopback redirects).
# Add -f docker-compose.e2e.sso-resource-indicators.yml for Keycloak's
# experimental RFC 8707 support.
#
# The browser reaches Keycloak at RIFFADO_E2E_KEYCLOAK_URL; the app container
# reaches it over the compose network. KC_HOSTNAME keeps the issuer and the
# login pages on the browser's URL, the dynamic backchannel answers the app's
# token and discovery requests on the internal one.
#
# Test-only: admin/admin, plain http and known passwords. Keycloak listens on
# loopback unless RIFFADO_E2E_KEYCLOAK_BIND says otherwise. Where the browser
# is not on the Docker host (a docker-in-docker sandbox), publish on all
# interfaces and use the daemon's host name:
#   RIFFADO_E2E_KEYCLOAK_BIND=0.0.0.0 RIFFADO_E2E_KEYCLOAK_URL=http://docker:8180

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${RIFFADO_E2E_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${RIFFADO_E2E_KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./e2e/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${RIFFADO_E2E_KEYCLOAK_BIND:-127.0.0.1}:${RIFFADO_E2E_KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  app:
    environment:
      OIDC_ISSUER_URL: http://keycloak:8080/realms/riffado-e2e
      OIDC_CLIENT_ID: riffado
      OIDC_CLIENT_SECRET: riffado-e2e-client-secret
      OIDC_PROVIDER_NAME: Keycloak
    depends_on:
      keycloak:
        condition: service_healthy
