<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chatterbox Meeting Recorder</title>
        <link rel="stylesheet" href="../popup/popup.css" />
        <link rel="stylesheet" href="picker.css" />
    </head>
    <body>
        <header class="picker-header">
            <img src="../icons/icon-128.png" alt="" width="58" height="58" />
            <div>
                <h1 data-i18n="extensionName">Chatterbox Meeting Recorder</h1>
                <p data-i18n="pickerInstruction">Choose a tab or screen with audio in Chrome's dialog.</p>
            </div>
        </header>
        <p id="picker-status" role="status" data-i18n="openingPicker">Opening audio picker…</p>
        <div id="picker-meters" hidden>
            <div class="meter"><label data-i18n="you">You</label><div class="bar"><div id="picker-mic-bar"></div></div></div>
            <div class="meter"><label data-i18n="others">Others</label><div class="bar"><div id="picker-system-bar"></div></div></div>
        </div>
        <div class="row">
            <button id="picker-cancel" type="button" data-i18n="cancel">Cancel</button>
            <button id="picker-minimize" type="button" data-i18n="minimize" hidden>Minimize</button>
            <button id="picker-stop" class="primary" type="button" data-i18n="stopSave" hidden>Stop and save</button>
        </div>
        <script type="module" src="picker.js"></script>
    </body>
</html>
